name: Trigger auto deployment for spanish-amigo-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/spanish-amigo-backend-AutoDeployTrigger-07a4ca96-1645-4db5-90fa-1ac43a7f8379.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SPANISHAMIGOBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPANISHAMIGOBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPANISHAMIGOBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SPANISHAMIGOBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SPANISHAMIGOBACKEND_REGISTRY_PASSWORD }}
          containerAppName: spanish-amigo-backend
          resourceGroup: spanish-amigo
          imageToBuild: lypandrew87/spanish-amigo-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


